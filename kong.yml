_format_version: "3.0"

services:
  - name: api-service
    url: http://api-service:8080
    routes:
      - name: api-route
        paths:
          - /api
    plugins:
      - name: rate-limiting
        config:
          minute: 10
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true

  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
    plugins:
      - name: rate-limiting
        config:
          minute: 10
