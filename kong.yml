_format_version: "3.0"

plugins:
  - name: file-log
    config:
      path: /dev/stdout
      reopen: true

services:
  - name: api-service
    url: http://api-service:8080
    routes:
      - name: api-route
        paths:
          - /api
    plugins:
      - name: rate-limiting
        config:
          minute: 10
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true
      - name: circuit-breaker
        config:
          failure_threshold: 50
          success_threshold: 2
          timeout: 60
          half_open_limit: 5
      - name: proxy-cache
        config:
          response_code:
            - 200
          request_method:
            - GET
          content_type:
            - application/json
          cache_ttl: 30
          strategy: memory

  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
    plugins:
      - name: rate-limiting
        config:
          minute: 10
      - name: circuit-breaker
        config:
          failure_threshold: 50
          success_threshold: 2
          timeout: 60
          half_open_limit: 5
